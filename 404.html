<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // Ambil path dari URL
        const path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
        
        // Jika path mengandung /s/CODE
        const match = path.match(/^s\/([a-zA-Z0-9\-_]+)$/);
        
        if (match) {
            // Redirect ke redirect.html dengan parameter
            window.location.href = '/redirect.html?code=' + encodeURIComponent(match[1]);
        } else if (path && path !== 'index.html' && path !== 'redirect.html' && path !== '404.html') {
            // Jika ada path lain, anggap sebagai short code
            window.location.href = '/redirect.html?code=' + encodeURIComponent(path);
        } else {
            // Jika tidak ada path, ke halaman utama
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
