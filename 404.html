<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Cek apakah ini shortlink
        const path = window.location.pathname;
        const match = path.match(/\/s\/([a-zA-Z0-9]+)/);
        
        if (match) {
            // Redirect ke redirect handler dengan parameter
            const code = match[1];
            window.location.href = `/redirect.html?code=${code}`;
        } else {
            // Jika bukan shortlink, redirect ke home
            window.location.href = '/';
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
