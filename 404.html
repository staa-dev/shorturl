<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0C0C1D;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .redirect-container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 24px;
            border: 4px solid rgba(108, 92, 231, 0.2);
            border-radius: 50%;
            border-top-color: #6C5CE7;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .redirect-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #6C5CE7, #00CEC9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .redirect-text {
            color: #B2BEC3;
            font-size: 0.95rem;
        }
        
        .error-container {
            display: none;
        }
        
        .error-container.show {
            display: block;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .error-message {
            color: #E17055;
            margin-bottom: 24px;
            font-size: 1.1rem;
        }
        
        .back-btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #6C5CE7, #5A4BD1);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
        }
    </style>
</head>
<body>
    <div class="redirect-container" id="redirectContainer">
        <div class="spinner"></div>
        <h2 class="redirect-title">Mengarahkan...</h2>
        <p class="redirect-text" id="statusText">Mencari link tujuan</p>
    </div>
    
    <div class="redirect-container error-container" id="errorContainer">
        <div class="error-icon">🔗</div>
        <h2 class="redirect-title">Link Tidak Ditemukan</h2>
        <p class="error-message" id="errorMessage">Shortlink ini tidak valid atau sudah dihapus</p>
        <a href="/" class="back-btn">← Kembali ke Beranda</a>
    </div>

    <script>
        // Konfigurasi Supabase - GANTI DENGAN KREDENSIAL ANDA
        const SUPABASE_URL = 'https://xxxxxxxxxxxx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
        
        async function handleRedirect() {
            const redirectContainer = document.getElementById('redirectContainer');
            const errorContainer = document.getElementById('errorContainer');
            const statusText = document.getElementById('statusText');
            
            // Extract short code from URL
            let shortCode = null;
            
            // Try to get code from query parameter (from redirect.html)
            const urlParams = new URLSearchParams(window.location.search);
            shortCode = urlParams.get('code');
            
            // If no query param, extract from path
            if (!shortCode) {
                const path = window.location.pathname;
                const pathParts = path.split('/').filter(part => part.length > 0);
                
                if (pathParts.length > 0) {
                    // If path is /s/CODE or /CODE
                    if (pathParts[0] === 's' && pathParts.length > 1) {
                        shortCode = pathParts[1];
                    } else {
                        shortCode = pathParts[0];
                    }
                }
            }
            
            // If still no code, show error
            if (!shortCode || shortCode === 'index.html' || shortCode === '404.html') {
                showError('Link tidak valid');
                return;
            }
            
            console.log('🔍 Looking for short code:', shortCode);
            
            try {
                // Initialize Supabase
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                statusText.textContent = 'Mencari link...';
                
                // Get original URL from database
                const { data, error } = await supabase
                    .from('shortlinks')
                    .select('original_url, short_code')
                    .eq('short_code', shortCode)
                    .single();
                
                if (error || !data) {
                    console.error('❌ Link not found:', error);
                    showError('Link tidak ditemukan');
                    return;
                }
                
                console.log('✅ Link found:', data.original_url);
                statusText.textContent = 'Link ditemukan! Mengarahkan...';
                
                // Update click count (fire and forget)
                updateClickCount(supabase, shortCode);
                
                // Redirect to original URL
                setTimeout(() => {
                    window.location.href = data.original_url;
                }, 500);
                
            } catch (error) {
                console.error('❌ Redirect error:', error);
                showError('Terjadi kesalahan saat mengarahkan');
            }
        }
        
        async function updateClickCount(supabase, shortCode) {
            try {
                const { error } = await supabase.rpc('increment_clicks', {
                    code_to_update: shortCode
                });
                
                if (error) {
                    // Fallback: direct update
                    const { data: currentData } = await supabase
                        .from('shortlinks')
                        .select('clicks')
                        .eq('short_code', shortCode)
                        .single();
                    
                    if (currentData) {
                        await supabase
                            .from('shortlinks')
                            .update({ clicks: (currentData.clicks || 0) + 1 })
                            .eq('short_code', shortCode);
                    }
                }
            } catch (error) {
                console.warn('⚠️ Failed to update click count:', error);
            }
        }
        
        function showError(message) {
            document.getElementById('redirectContainer').style.display = 'none';
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.classList.add('show');
            document.getElementById('errorMessage').textContent = message;
        }
        
        // Run redirect when page loads
        window.addEventListener('DOMContentLoaded', handleRedirect);
    </script>
</body>
</html>
