<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0C0C1D 0%, #1A1A2E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        
        .loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            position: relative;
        }
        
        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        
        .loader-ring:nth-child(1) {
            border-top-color: #6C5CE7;
            animation: spin1 2s linear infinite;
        }
        
        .loader-ring:nth-child(2) {
            border-right-color: #00CEC9;
            animation: spin2 2s linear infinite;
        }
        
        .loader-ring:nth-child(3) {
            border-bottom-color: #FD79A8;
            animation: spin3 2s linear infinite;
        }
        
        @keyframes spin1 { to { transform: rotate(360deg); } }
        @keyframes spin2 { to { transform: rotate(-360deg); } }
        @keyframes spin3 { to { transform: rotate(720deg); } }
        
        .title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6C5CE7, #00CEC9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        
        .status {
            color: #B2BEC3;
            font-size: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .error-box {
            background: rgba(225, 112, 85, 0.1);
            border: 2px solid rgba(225, 112, 85, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin-top: 20px;
            display: none;
        }
        
        .error-box.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .error-title {
            color: #E17055;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 20px 0 12px;
        }
        
        .error-text {
            color: #FAB1A0;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .home-btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #6C5CE7, #5A4BD1);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingState">
            <div class="loader">
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
            </div>
            <h1 class="title">Mengarahkan</h1>
            <p class="status" id="loadingStatus">Mencari link tujuan...</p>
        </div>
        
        <div class="error-box" id="errorState">
            <div style="font-size:4rem;">🔗</div>
            <h2 class="error-title">Link Tidak Ditemukan</h2>
            <p class="error-text" id="errorDetail">Shortlink tidak valid atau sudah kadaluarsa</p>
            <a href="/" class="home-btn">🏠 Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI SUPABASE - GANTI DENGAN KREDENSIAL ANDA
        // ============================================
        const SUPABASE_URL = 'https://xxxxxxxxxxxx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
        const SUPABASE_TABLE = 'shortlinks';
        
        async function redirect() {
            const loadingStatus = document.getElementById('loadingStatus');
            
            // Get short code from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            let shortCode = urlParams.get('code');
            
            // If no code in query, try to get from path
            if (!shortCode) {
                const path = window.location.pathname;
                const match = path.match(/\/s\/([a-zA-Z0-9\-_]+)/);
                if (match) {
                    shortCode = match[1];
                }
            }
            
            console.log('🔍 Short code:', shortCode);
            
            if (!shortCode) {
                showError('Kode shortlink tidak ditemukan');
                return;
            }
            
            try {
                loadingStatus.textContent = 'Mencari di database...';
                
                // Query Supabase using Fetch API
                const url = `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?short_code=eq.${encodeURIComponent(shortCode)}&select=*`;
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Database error');
                }
                
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    showError(`Link dengan kode "${shortCode}" tidak ditemukan`);
                    return;
                }
                
                const linkData = data[0];
                console.log('✅ Link found:', linkData.original_url);
                
                loadingStatus.textContent = 'Mengarahkan ke tujuan...';
                
                // Update click count
                updateClicks(shortCode, linkData.clicks || 0);
                
                // Redirect
                setTimeout(() => {
                    window.location.href = linkData.original_url;
                }, 500);
                
            } catch (error) {
                console.error('❌ Error:', error);
                showError('Gagal mengakses database: ' + error.message);
            }
        }
        
        async function updateClicks(shortCode, currentClicks) {
            try {
                const url = `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?short_code=eq.${encodeURIComponent(shortCode)}`;
                await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ clicks: (currentClicks || 0) + 1 })
                });
                console.log('✅ Click updated');
            } catch (error) {
                console.warn('⚠️ Click update failed:', error);
            }
        }
        
        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            const errorState = document.getElementById('errorState');
            errorState.classList.add('show');
            document.getElementById('errorDetail').textContent = message;
        }
        
        // Start redirect
        window.addEventListener('DOMContentLoaded', redirect);
    </script>
</body>
</html>
